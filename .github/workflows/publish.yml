name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) and `npm stage` require a recent npm
      - name: Update npm
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Authenticates via npm trusted publishing: no NPM_TOKEN secret needed.
      # The trusted publisher is only allowed to stage: approve the staged
      # version on npmjs.com (or with `npm stage approve`) to make it public.
      - name: Stage publish
        run: npm stage publish --provenance --access public
